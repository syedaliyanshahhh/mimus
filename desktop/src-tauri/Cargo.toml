[package]
name = "mimus-desktop"
version = "0.1.0"
description = "Mimus desktop app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mimus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.8", features = [] }

[dependencies]
tauri = { version = "2.13", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
url = "2.5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
